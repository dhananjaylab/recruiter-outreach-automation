name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: "pytest / Python ${{ matrix.python-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package + dev extras
        # `pip install -e .` makes recruiter_outreach importable directly
        # from the project root — no src/ path hacking needed.
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v --cov=recruiter_outreach --cov-report=term-missing

      - name: Verify package is importable
        run: python -c "import recruiter_outreach; print(recruiter_outreach.__version__)"

      - name: Verify console scripts are registered
        run: |
          recruiter-outreach --help
          recruiter-outreach-check-inbox --help
          recruiter-outreach-followups --help

      - name: Verify FastAPI app boots
        run: |
          python -c "
          from fastapi.testclient import TestClient
          from recruiter_outreach.api.main import app
          client = TestClient(app)
          resp = client.get('/health')
          assert resp.status_code == 200, resp.text
          print('FastAPI /health OK:', resp.json())
          "

      - name: Verify Streamlit app has no syntax/import errors
        run: python -m py_compile frontend/streamlit_app.py
