[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recruiter-outreach-automation"
version = "3.0.0"
description = "Personalized recruiter outreach with a FastAPI + Streamlit human-in-the-loop layer, Gmail OAuth2 delivery, deliverability hardening, follow-ups, and reply/bounce tracking."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "chardet>=5.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "odfpy>=1.4",
    "pdfplumber>=0.10",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "python-dotenv>=1.0",
    "dnspython>=2.4",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.140",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "streamlit>=1.38",
    "requests>=2.32",
]

[project.optional-dependencies]
llm = ["anthropic>=0.30"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
recruiter-outreach            = "recruiter_outreach.cli:main"
recruiter-outreach-check-inbox = "recruiter_outreach.tracking.cli:main"
recruiter-outreach-followups   = "recruiter_outreach.followup.cli:main"

# ---------------------------------------------------------------------------
# Package discovery
# Per the Hitchhiker's Guide, the module lives at the project root, NOT
# inside a src/ subdirectory.  Setuptools finds it automatically here.
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*", "frontend*"]

[tool.pytest.ini_options]
# No pythonpath manipulation needed: tests/context.py handles it, and
# `pip install -e .` makes the package importable normally.
testpaths = ["tests"]
